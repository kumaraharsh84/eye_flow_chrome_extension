<!-- 
  This is a helper file to generate icon PNGs.
  Open this in a browser, right-click each icon, and save as PNG.
  Then rename them to icon16.png, icon48.png.
  
  OR: Just use the 128px icon for all sizes — Chrome will auto-resize.
-->
<!DOCTYPE html>
<html>
<head><title>EyeFlow Icon Generator</title></head>
<body style="background:#111; padding:40px; font-family:sans-serif; color:#fff;">
  <h2>EyeFlow Icons — Right-click → Save Image As</h2>
  <div style="display:flex; gap:30px; align-items:end; margin-top:20px;">
    <div>
      <canvas id="c16" width="16" height="16"></canvas>
      <p>16×16</p>
    </div>
    <div>
      <canvas id="c48" width="48" height="48"></canvas>
      <p>48×48</p>
    </div>
    <div>
      <canvas id="c128" width="128" height="128"></canvas>
      <p>128×128</p>
    </div>
  </div>
  <script>
    function drawIcon(canvasId, size) {
      const c = document.getElementById(canvasId);
      const ctx = c.getContext('2d');
      const s = size;
      
      // Background circle
      const grad = ctx.createRadialGradient(s/2,s/2,0, s/2,s/2,s/2);
      grad.addColorStop(0, '#7c3aed');
      grad.addColorStop(1, '#4c1d95');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(s/2, s/2, s/2-1, 0, Math.PI*2);
      ctx.fill();
      
      // Eye white
      ctx.fillStyle = '#e2e8f0';
      ctx.beginPath();
      ctx.ellipse(s/2, s/2, s*0.35, s*0.2, 0, 0, Math.PI*2);
      ctx.fill();
      
      // Iris
      const irisGrad = ctx.createRadialGradient(s/2,s/2,0, s/2,s/2,s*0.14);
      irisGrad.addColorStop(0, '#a78bfa');
      irisGrad.addColorStop(1, '#6d28d9');
      ctx.fillStyle = irisGrad;
      ctx.beginPath();
      ctx.arc(s/2, s/2, s*0.14, 0, Math.PI*2);
      ctx.fill();
      
      // Pupil
      ctx.fillStyle = '#1e1b4b';
      ctx.beginPath();
      ctx.arc(s/2, s/2, s*0.06, 0, Math.PI*2);
      ctx.fill();
    }
    drawIcon('c16', 16);
    drawIcon('c48', 48);
    drawIcon('c128', 128);
  </script>
</body>
</html>
