name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build, unit tests and extension smoke test
        run: npm test
      - name: Package for the Chrome Web Store
        run: node scripts/package.js
      - name: Upload store package
        uses: actions/upload-artifact@v4
        with:
          name: eyeflow-extension
          path: release/*.zip
