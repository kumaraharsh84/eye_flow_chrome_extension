<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EyeFlow — Doom Scroll Blocker & Eye Care</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f0f13;
        color: #e8e8f0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 24px;
        text-align: center;
      }
      .emoji {
        font-size: 64px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 42px;
        font-weight: 800;
        margin-bottom: 12px;
      }
      .tagline {
        font-size: 20px;
        color: #a0a0b8;
        margin-bottom: 40px;
        max-width: 520px;
        line-height: 1.6;
      }
      .badges {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 48px;
      }
      .badge {
        background: #1e1e2e;
        border: 1px solid #2e2e42;
        border-radius: 999px;
        padding: 8px 18px;
        font-size: 14px;
        color: #c0c0d8;
      }
      .cta {
        display: inline-block;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: white;
        text-decoration: none;
        padding: 14px 32px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 48px;
        transition: transform 0.2s;
      }
      .cta:hover {
        transform: translateY(-2px);
      }
      .links {
        display: flex;
        gap: 24px;
      }
      .links a {
        color: #6366f1;
        text-decoration: none;
        font-size: 14px;
      }
      .links a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="emoji">👁️</div>
    <h1>EyeFlow</h1>
    <p class="tagline">
      Doom scroll less. See better.<br />
      Smart eye breaks, hydration nudges, and gentle reminders — built into your browser.
    </p>
    <div class="badges">
      <span class="badge">Instagram</span>
      <span class="badge">YouTube Shorts</span>
      <span class="badge">Reddit</span>
      <span class="badge">X / Twitter</span>
      <span class="badge">Facebook</span>
      <span class="badge">TikTok</span>
      <span class="badge">Snapchat</span>
      <span class="badge">LinkedIn</span>
      <span class="badge">Twitch</span>
    </div>
    <a
      class="cta"
      href="https://github.com/kumaraharsh84/eye_flow_chrome_extension"
      target="_blank"
    >
      View on GitHub →
    </a>
    <div class="links">
      <a href="privacy-policy.html">Privacy Policy</a>
      <a
        href="https://github.com/kumaraharsh84/eye_flow_chrome_extension/blob/main/README.md"
        target="_blank"
        >Documentation</a
      >
    </div>
  </body>
</html>
